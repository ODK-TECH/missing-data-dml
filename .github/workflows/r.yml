name: smoke-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install packages
        run: install.packages(c("mice", "smcfcs", "ranger", "ggplot2"))
        shell: Rscript {0}

      - name: Run smoke test
        run: Rscript tests/test-smoke.R

      - name: Run the quick study
        env:
          QUICK: "1"
        run: Rscript scripts/run-all.R
